name: NumberGrid tests and lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-linters:
    name: Python 3.12 / CPU
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      PYTHONPATH: .:stoa-src
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install pinned runtime without CUDA packages
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib
          requirements = []
          for line in Path('numbergrid-runtime.txt').read_text().splitlines():
              line = line.strip()
              if line and not line.startswith(('#', 'nvidia-')):
                  requirements.append(line.replace('jax[cuda13]', 'jax'))
          dev = tomllib.loads(Path('pyproject.toml').read_text())['project']['optional-dependencies']['dev']
          subprocess.run(['uv', 'pip', 'install', '--system', '--constraint',
                          'runtime-constraints.txt', *requirements, *dev], check=True)
          PY

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run NumberGrid and Chex tests
        run: python -m pytest -q --junitxml=test-results.xml
