# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: ru-RU
tone_instructions: "Пиши кратко и по делу. Для замечания укажи сценарий ошибки, последствия и проверку. Отделяй подтверждённые ошибки от предположений."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  review_status: true
  review_details: true
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: true
    base_branches: [".*"]
  path_filters:
    - "!results/**"
    - "!viewer.html"
  path_instructions:
    - path: "**/*.py"
      instructions: >-
        Follow AGENTS.md when present and docs/CODE_REVIEW.md. Prioritize observable
        correctness defects, PRNG independence, action masks, terminal/reset state,
        reward and PPO consistency, JAX tracing and GPU execution. Explain a
        reproducing scenario. Do not recommend CPU/NumPy callbacks or host transfers
        in the environment/learner loop. Treat speed regressions as hypotheses
        unless a comparable synchronized GPU benchmark demonstrates them.
        Do not request broad formatting, docstring expansion, or unrelated refactors.
    - path: "web/**"
      instructions: >-
        Human mode must use the same JAX environment through the local server.
        JavaScript handles rendering and commands, not an alternative implementation
        of training rules. Check consistency of action IDs, masks and episode resets.
        Review source templates rather than the generated root viewer.html.
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/CODE_REVIEW.md"
